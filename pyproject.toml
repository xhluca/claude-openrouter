[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claude-openrouter"
version = "0.1.5"
description = "Select OpenRouter models directly inside Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xhluca" }]
keywords = ["claude-code", "openrouter", "coding-agent", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xhluca/claude-openrouter"
Repository = "https://github.com/xhluca/claude-openrouter"
Issues = "https://github.com/xhluca/claude-openrouter/issues"
Installer = "https://xhluca.github.io/claude-openrouter/install.sh"

[project.scripts]
claude-openrouter = "claude_openrouter.cli:main"
clor = "claude_openrouter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_openrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
